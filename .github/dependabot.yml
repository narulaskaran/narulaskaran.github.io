version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    groups:
      eslint-toolchain:
        patterns:
          - eslint
          - eslint-*
          - "@eslint/*"
          - typescript-eslint
          - "@typescript-eslint/*"

      vite-toolchain:
        patterns:
          - vite
          - "@vitejs/*"
          - rollup
          - esbuild

    ignore:
      # @eslint/js majors track eslint majors; keep them in lockstep.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major
